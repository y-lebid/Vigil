[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil"
version = "0.1.0"
description = "Lightweight CLI SIEM for log parsing and rule-based detection"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
vigil = "vigil.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]